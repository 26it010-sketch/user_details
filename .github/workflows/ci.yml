
name: Build and Deploy Application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          RAW_IMAGE="ghcr.io/${{ github.repository }}:latest"
          IMAGE_NAME=$(echo "$RAW_IMAGE" | tr '[:upper:]' '[:lower:]')

          echo "Building image: $IMAGE_NAME"
          docker build -t "$IMAGE_NAME" .

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Pushing image: $IMAGE_NAME"
            docker push "$IMAGE_NAME"
          fi

      - name: Deploy to Ubuntu server
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.2.0

        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true

          envs: DB_HOST,DB_PORT,DB_NAME,DB_USER,DB_PASSWORD

          script: |
            IMAGE="ghcr.io/${{ github.repository }}:latest"
            IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')

            echo "Pulling latest image"
            docker pull "$IMAGE"

            docker stop meena-backend-container || true
            docker rm meena-backend-container || true

            docker run -d \
              --name meena-backend-container \
              --restart unless-stopped \
              --network meena-network \
              -p 9000:9000 \
              -e DB_HOST="$DB_HOST" \
              -e DB_PORT="$DB_PORT" \
              -e DB_NAME="$DB_NAME" \
              -e DB_USER="$DB_USER" \
              -e DB_PASSWORD="$DB_PASSWORD" \
              "$IMAGE"

            docker image prune -f

