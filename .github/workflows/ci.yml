name: Build and Deploy Application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Grant GITHUB_TOKEN permissions to publish packages to GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        run: |
          # Convert repository name to lowercase to comply with Docker naming rules
          RAW_IMAGE="ghcr.io/${{ github.repository_owner }}/meena-backend:latest"
          IMAGE_NAME=$(echo "$RAW_IMAGE" | tr '[:upper:]' '[:lower:]')

          echo "Building image: $IMAGE_NAME"
          docker build -t "$IMAGE_NAME" .

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Pushing image: $IMAGE_NAME"
            docker push "$IMAGE_NAME"
          fi

      - name: Deploy to Ubuntu server
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/meena-backend:latest
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE
          script: |
            set -e

            # Convert image name to lowercase for SSH pull
            IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')

            docker pull "$IMAGE"

            docker stop meena-backend-container || true
            docker rm meena-backend-container || true

            docker run -d \
              --name meena-backend-container \
              --restart unless-stopped \
              --network meena-network \
              --env-file /home/ubuntu/meena/server-DB/backend/.env \
              -p 9000:9000 \
              "$IMAGE"

            docker image prune -f